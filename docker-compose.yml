version: "3.8"

services:
  monitoring-agent:
    build: .
    container_name: monitoring-agent-api
    restart: unless-stopped
    # Permite al contenedor ver los procesos reales del host (necesario para psutil)
    pid: host
    # Mapeo de puertos para Windows (Expone el 8001 interno al 8000 externo)
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      # Sincroniza el archivo .env para que la clave generada persista en el host
      - ./.env:/app/.env
      # Da permisos para controlar el Docker padre
      - /var/run/docker.sock:/var/run/docker.sock
      # Da acceso de solo lectura a las métricas reales del disco y CPU
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    environment:
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys
