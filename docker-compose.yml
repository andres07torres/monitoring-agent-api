version: "3.8"

services:
  monitoring-agent:
    build: .
    container_name: monitoring-agent-api
    restart: unless-stopped
    # Permite al contenedor acceder a los namespaces y PID 1 del anfitrión
    pid: host
    privileged: true
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      # Da permisos para controlar el Docker padre
      - /var/run/docker.sock:/var/run/docker.sock
      # Da acceso de solo lectura a las métricas reales del disco y CPU
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    environment:
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys
